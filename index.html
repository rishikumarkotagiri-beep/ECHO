<script type="module">
  import { EchoBrainV3 } from './core/echo.js';

  // 1. Initialize Cognitive Core
  const brain = new EchoBrainV3();

  // 2. Setup 3D Scene (Three.js)
  const container = document.getElementById('canvas-container');
  let scene, camera, renderer, echoMesh;
  const entities = [];

  if (container && typeof THREE !== 'undefined') {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111625);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 8, 14);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({ color: 0x223322 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // ECHO Mesh
    echoMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 })
    );
    echoMesh.position.set(0, 0.8, 0);
    scene.add(echoMesh);

    // World Entities
    const objectList = [
      { id: 'Old Man', type: 'npc', mesh: new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.2), new THREE.MeshStandardMaterial({ color: 0xaa6633 })), pos: [-3, 0.6, -2] },
      { id: 'Wooden House', type: 'building', mesh: new THREE.Mesh(new THREE.BoxGeometry(3, 2.5, 3), new THREE.MeshStandardMaterial({ color: 0x664422 })), pos: [4, 1.25, -4] },
      { id: 'Water Well', type: 'object', mesh: new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0x888888 })), pos: [0, 0.4, -5] }
    ];

    objectList.forEach(e => {
      e.mesh.position.set(...e.pos);
      scene.add(e.mesh);
      entities.push(e);
    });

    // Render Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      if (echoMesh) echoMesh.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  // 3. Perception Generator
  function getPerceptions() {
    if (entities.length > 0 && echoMesh) {
      return entities.map(e => ({
        id: e.id,
        type: e.type,
        distance: Math.round(echoMesh.position.distanceTo(e.mesh.position) * 10) / 10,
        state: 'static'
      }));
    }
    return [
      { id: 'Old Man', type: 'npc', distance: 3.0 },
      { id: 'Wooden House', type: 'building', distance: 12.0 },
      { id: 'Water Well', type: 'object', distance: 8.0 }
    ];
  }

  // Safe DOM Helper
  function setDOMText(id, text) {
    const el = document.getElementById(id);
    if (el) el.innerText = text;
  }

  // 4. Main Simulation Step
  function runSimulation() {
    const perceptions = getPerceptions();

    try {
      const output = brain.step(perceptions);

      // DOM Updates
      setDOMText('hud-cycle', `CYCLE: ${output.cycle}`);
      setDOMText('hud-goal', output.activeGoal);
      setDOMText('val-surprise', output.surpriseScore.toFixed(2));
      setDOMText('hud-reflection', output.latestReflection);

      if (output.action) {
        setDOMText('hud-action', `ACTION: ${output.action.type} -> ${output.action.target}`);
      }

      const subGoalsElem = document.getElementById('hud-subgoals');
      if (subGoalsElem && output.subGoals) {
        subGoalsElem.innerHTML = output.subGoals.map(sg => `<li>${sg}</li>`).join('');
      }

      const surpriseBar = document.getElementById('bar-surprise');
      if (surpriseBar) {
        surpriseBar.style.width = `${Math.min(100, output.surpriseScore * 100)}%`;
      }

      const thoughtLog = document.getElementById('hud-thoughts');
      if (thoughtLog && output.latestReflection) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerText = `[Cycle ${output.cycle}] ${output.latestReflection}`;
        thoughtLog.prepend(entry);
      }

      const percHUD = document.getElementById('hud-perceptions');
      if (percHUD) {
        percHUD.innerHTML = perceptions.map(p => `<div class="log-entry">⦿ ${p.id} (${p.distance || 0}m)</div>`).join('');
      }

    } catch (err) {
      console.error("Simulation Execution Error:", err);
    }
  }

  // Start Cognitive Loop
  setInterval(runSimulation, 1500);
</script>

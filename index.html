<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECHO</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="background"></div>

  <main class="app">

    <header>
      <div class="logo">
        <span class="dot"></span>
        ECHO
      </div>

      <div class="status">
        <span class="status-dot"></span>
        ONLINE
      </div>
    </header>

    <section class="hero">

      <div class="echo-orb">
        <div class="orb-core"></div>
        <div class="orb-ring ring-one"></div>
        <div class="orb-ring ring-two"></div>
        <div class="orb-ring ring-three"></div>
      </div>

      <h1>ECHO</h1>

      <p class="subtitle">
        I listen. I remember. I respond.
      </p>

      <div id="conversation" class="conversation">
        <div class="message echo-message">
          <span class="name">ECHO</span>
          <p>Hello.</p>
          <p>I'm listening.</p>
        </div>
      </div>

      <div class="input-area">
        <input
          id="userInput"
          type="text"
          placeholder="Talk to ECHO..."
          autocomplete="off"
        />

        <button id="sendButton">
          →
        </button>
      </div>

    </section>

    <footer>
      <span>ECHO v1.0</span>
      <span>BUILT FOR CURIOSITY</span>
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
